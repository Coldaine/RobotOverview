# teleop_joy_operator.yaml — DRAFT, not wired into any package yet.
#
# ros__parameters for a `teleop_twist_joy` node instance dedicated to the
# WORKSTATION gamepad path: Foxglove's Joystick connector (browser/desktop,
# reading a physical controller via the W3C Gamepad API) publishes
# sensor_msgs/Joy on /joy_operator -> this node converts it to a
# geometry_msgs/Twist on /cmd_vel_joy_operator -> twist_mux (priority 100,
# see twist_mux.yaml) -> ugv_bringup's /cmd_vel.
#
# Package: teleop_twist_joy  Executable: teleop_node  Node name (fixed by
# the package's own launch example, github.com/ros2/teleop_twist_joy,
# `humble` branch, launch/teleop-launch.py): teleop_twist_joy_node — the
# ros__parameters key below must match that node name exactly for this
# file to load as a parameters YAML.
#
# Param names/defaults confirmed against
# github.com/ros2/teleop_twist_joy/blob/humble/README.md and the shipped
# config/xbox.config.yaml on that same branch.
#
# NOTE: this file does not set `joy` or `cmd_vel` topic names — teleop_twist_joy
# subscribes to a plain relative "joy" and publishes a plain relative
# "cmd_vel". Remapping those to /joy_operator and /cmd_vel_joy_operator is
# done in cockpit_robot.launch.py (remappings=... on the Node action), not
# here — ros__parameters YAML files cannot express topic remaps.
teleop_twist_joy_node:
  ros__parameters:
    # Movement only counts while this button is held — protects against a
    # stray axis value (drift, a bumped stick before the operator is
    # actually paying attention) turning into motion. This is a "soft"
    # deadman: it only stops teleop_twist_joy from emitting nonzero Twists.
    # It does NOT protect against the operator's whole client (browser tab,
    # laptop, network) disappearing mid-command — see cockpit README for
    # why the Jetson-side cmd_vel_timeout watchdog is the real backstop.
    require_enable_button: true

    # Button indices below assume the STANDARD W3C Gamepad API button
    # order (index 4 = left bumper/LB, index 5 = right bumper/RB), which is
    # what an Xbox-style controller reports through a browser and is also
    # the convention ros2/teleop_twist_joy's own xbox.config.yaml assumes
    # for axis layout. Foxglove's joystick extension is documented to
    # normalize axis-sign differences between the browser Gamepad API and
    # native Linux joystick drivers, but it does not guarantee identical
    # button ORDER for every controller model/OS/browser combination.
    # VERIFY on the actual workstation + controller before trusting this:
    #   ros2 topic echo /joy_operator
    # and watch which index in the `buttons` array flips when you press RB
    # / LB. Adjust enable_button / enable_turbo_button below if it's not
    # 5 / 4 on your hardware.
    enable_button: 5        # RB — enable regular-speed movement
    enable_turbo_button: 4  # LB — enable turbo (scale_*_turbo below)

    # Left stick: vertical axis = linear.x, horizontal axis = angular.z.
    # Index convention (0 = left stick X, 1 = left stick Y) matches both
    # the W3C standard gamepad mapping and ros2/teleop_twist_joy's own
    # xbox.config.yaml. VERIFY alongside the button indices above with
    # `ros2 topic echo /joy_operator` if this feels inverted or swapped —
    # some browsers report an already-inverted Y axis, which Foxglove's
    # extension is meant to correct for, but confirm on the day.
    axis_linear:
      x: 1
    axis_angular:
      yaw: 0

    # Crawl-safe default: 0.2 m/s regular, 0.4 m/s with turbo held. Chosen
    # to stay well under anything that would outrun a human's reaction time
    # next to a slow tracked platform (see docs/beast-ops.md "Chassis
    # dynamics" — Beast is described as slow and hard-stopping already;
    # this keeps the OPERATOR's own commanded ceiling low too, independent
    # of whatever the chassis itself is physically capable of).
    scale_linear:
      x: 0.2
    scale_linear_turbo:
      x: 0.4

    # Angular rate is NOT boosted by turbo — turbo only buys more forward
    # speed for covering ground faster, not more spin rate, so the operator
    # doesn't lose fine steering control right when they're moving fastest.
    # (teleop_twist_joy defaults scale_angular_turbo to 1.0 if unset; set
    # explicitly here so the "no turbo boost on rotation" choice is visible
    # in the file rather than relying on an unstated default.)
    scale_angular:
      yaw: 1.0
    scale_angular_turbo:
      yaw: 1.0

    # ugv_bringup only reads linear.x + angular.z from geometry_msgs/Twist
    # (see AGENTS.md task context) — TwistStamped would just add an unused
    # header, so leave this at the package default.
    publish_stamped_twist: false
