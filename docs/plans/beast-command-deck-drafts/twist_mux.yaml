# twist_mux.yaml — DRAFT, not wired into any package yet.
#
# Arbitrates every velocity source that wants to drive BEAST-01 down to one
# /cmd_vel stream, which is exactly what ugv_bringup (ugv_bringup.py) already
# subscribes to. This file only holds the `twist_mux` node's ros__parameters;
# the node itself, the /cmd_vel_out -> /cmd_vel remap, and the source nodes
# (teleop_twist_joy, foxglove_bridge, nav2, ...) are wired up in
# cockpit_robot.launch.py.
#
# Schema confirmed against ros-teleop/twist_mux, `humble` branch (the source
# the ROS build farm compiles `ros-humble-twist-mux` from):
#   - github.com/ros-teleop/twist_mux/blob/humble/config/twist_mux_topics.yaml
#   - github.com/ros-teleop/twist_mux/blob/humble/config/twist_mux_locks.yaml
#   - github.com/ros-teleop/twist_mux/blob/humble/include/twist_mux/topic_handle.hpp
# Package: twist_mux  Executable: twist_mux  Output topic (fixed, not a
# param): "cmd_vel_out" — the launch file remaps this to /cmd_vel.
#
# ---------------------------------------------------------------------------
# How arbitration works (read this before changing priorities)
# ---------------------------------------------------------------------------
# Every entry under `topics` is a geometry_msgs/Twist source. On every
# message received on a source's topic, twist_mux re-publishes it to
# /cmd_vel_out ONLY IF that source is currently the highest-priority source
# that is neither expired (no message within `timeout` seconds) nor masked
# by an active lock (see below). This is push-driven, not a polling loop:
# there is no periodic re-publish, so if the winning source goes silent,
# twist_mux simply stops emitting anything at all until (a) that source
# publishes again, or (b) it expires past `timeout` and a lower-priority
# source's next message takes over. Silence is NOT the same as "stop" —
# nothing here sends a zero Twist on timeout. That job belongs entirely to
# ugv_bringup's own 0.5 s `cmd_vel_timeout` watchdog on the robot side
# (already deployed; see docs/beast-ops.md "cmd_vel-timeout watchdog"). This
# twist_mux layer only decides WHOSE command gets through; the Jetson-side
# watchdog is what guarantees the robot actually stops when nobody is
# driving. Keep both — they cover different failure modes (arbitration vs.
# dead link).
#
# Priority ladder (255 = absolute max; higher always wins over lower,
# subject to the expiry rule above):
#   255  emergency lock (see `locks.estop` below — not a Twist source)
#   150  cmd_vel_joy_robot      robot-paired BT gamepad (trusted, in-person,
#                                lowest latency, can override a distracted
#                                remote operator)
#   100  cmd_vel_joy_operator   workstation gamepad, via Foxglove's
#                                Joystick connector -> teleop_twist_joy
#    50  cmd_vel_ui             Foxglove Teleop panel / Vizanti click-to-drive
#    10  cmd_vel_nav            nav2 autonomy (lowest — a human always wins)
#
# Every source uses the same 0.5 s timeout as ugv_bringup's own watchdog, so
# a stale command gets excluded from arbitration on the same cadence the
# robot itself uses to decide "nobody is talking to me."
twist_mux:
  ros__parameters:
    topics:
      joy_robot:
        topic: cmd_vel_joy_robot
        timeout: 0.5
        priority: 150
      joy_operator:
        topic: cmd_vel_joy_operator
        timeout: 0.5
        priority: 100
      ui:
        topic: cmd_vel_ui
        timeout: 0.5
        priority: 50
      nav:
        topic: cmd_vel_nav
        timeout: 0.5
        priority: 10

    # -------------------------------------------------------------------
    # Emergency lock — NOT a Twist source. `locks.*` entries subscribe to
    # std_msgs/Bool. When a lock is "locked", every `topics` entry whose
    # priority is LOWER than the lock's priority is masked (excluded from
    # arbitration) regardless of how recently it published. Priority 255
    # here is deliberately higher than every source above (max is 150), so
    # an engaged lock silences all of them — a true emergency stop for the
    # arbitration layer.
    #
    # A lock is "locked" (LockTopicHandle::isLocked(), topic_handle.hpp) if
    # EITHER:
    #   (a) the last message received on the lock topic had data: true, OR
    #   (b) the lock has "expired" — i.e. `timeout > 0` and no message has
    #       arrived within the last `timeout` seconds.
    #
    # VERIFY (read from source, not official docs — behavior is consistent
    # across the humble branch history but re-confirm with
    # `ros2 param describe /twist_mux locks.estop.timeout` on the robot
    # before trusting blindly): the lock's internal "last received" stamp
    # initializes to time zero (epoch) at node startup, BEFORE any message
    # has ever arrived. That means if `timeout` here is > 0.0, the lock is
    # ALREADY "expired" (== locked) the instant twist_mux starts, and stays
    # locked until something publishes a heartbeat. That is a legitimate
    # fail-locked design (no e-stop heartbeat present -> no motion at all),
    # but nothing in this draft set yet publishes that heartbeat, so it
    # would leave /cmd_vel permanently silent out of the box.
    #
    # Chosen for this draft: timeout: 0.0 ("not used" per twist_mux's own
    # config comments) — the lock is then a pure manual toggle. Publishing
    # `std_msgs/Bool true` on cmd_vel_estop_lock engages it; publishing
    # `false` releases it; nothing auto-engages it on silence. This keeps
    # cockpit_robot.launch.py drivable immediately without a separate
    # heartbeat-publisher node. Once a real "operator client is alive"
    # heartbeat exists (e.g. published by whatever runs the Foxglove Teleop
    # panel or Vizanti), switch this to timeout: 0.5 to get the fail-locked
    # behavior above for free — no code change needed, just this value.
    #
    # This is intentionally a SEPARATE topic from any single client's UI
    # panel — see foxglove_bridge.launch.py's client_topic_whitelist, which
    # must include this topic or no client can ever engage/release it.
    locks:
      estop:
        topic: cmd_vel_estop_lock
        timeout: 0.0
        priority: 255
