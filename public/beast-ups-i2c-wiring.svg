<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-labelledby="title desc">
  <title id="title">BEAST-01 UPS Module 3S to Jetson Orin Nano I2C wiring</title>
  <desc id="desc">A three-wire interconnect diagram. UPS pin 3 ground connects to Jetson pin 6 ground. UPS pin 7 SCL connects to Jetson pin 5 SCL. UPS pin 8 SDA connects to Jetson pin 3 SDA. All UPS 5 volt and 3.3 volt pins are marked do not connect.</desc>
  <defs>
    <style>
      .bg { fill: #f3f0e8; }
      .ink { fill: #18232b; font-family: "Arial Narrow", Arial, sans-serif; }
      .mono { fill: #18232b; font-family: Consolas, "Liberation Mono", monospace; }
      .small { font-size: 22px; }
      .body { font-size: 28px; }
      .label { font-size: 32px; font-weight: 700; }
      .title { font-size: 54px; font-weight: 800; letter-spacing: 1px; }
      .sub { font-size: 25px; fill: #42535c; }
      .header-sub { font-size: 25px; fill: #d6e5e0; }
      .panel { fill: #fffdf7; stroke: #18232b; stroke-width: 4; }
      .pin { fill: #d9e0de; stroke: #18232b; stroke-width: 3; }
      .pin-use { fill: #d4efe7; stroke: #12635f; stroke-width: 4; }
      .pin-power { fill: #f4d9d3; stroke: #a13e36; stroke-width: 3; }
      .pin-jetson { fill: #dce9f3; stroke: #22577a; stroke-width: 4; }
      .wire-gnd { fill: none; stroke: #22282b; stroke-width: 10; stroke-linecap: round; }
      .wire-scl { fill: none; stroke: #1c6e8c; stroke-width: 10; stroke-linecap: round; }
      .wire-sda { fill: none; stroke: #1f8a54; stroke-width: 10; stroke-linecap: round; }
      .warning { fill: #fff0e7; stroke: #a13e36; stroke-width: 4; }
      .rule { stroke: #18232b; stroke-width: 3; }
      .strike { stroke: #a13e36; stroke-width: 6; }
      .dot-gnd { fill: #22282b; }
      .dot-scl { fill: #1c6e8c; }
      .dot-sda { fill: #1f8a54; }
    </style>
  </defs>

  <rect class="bg" width="1600" height="1100"/>
  <rect x="45" y="38" width="1510" height="120" fill="#18232b"/>
  <text x="85" y="92" class="title" fill="#fffdf7">BEAST-01 / UPS BATTERY TELEMETRY</text>
  <text x="85" y="130" class="header-sub">Three-wire I2C lead only. Robot powered down before fitting or removing leads.</text>

  <rect x="70" y="215" width="555" height="645" rx="18" class="panel"/>
  <text x="112" y="275" class="label ink">UPS MODULE 3S</text>
  <text x="112" y="315" class="mono body">2x4 header next to BOOT button</text>
  <text x="112" y="350" class="sub">Multifunction expansion header</text>
  <line x1="110" y1="382" x2="582" y2="382" class="rule"/>
  <text x="188" y="425" class="mono small">LEFT COLUMN</text>
  <text x="394" y="425" class="mono small">RIGHT COLUMN</text>

  <!-- UPS 2x4 header: 1/2 5V, 3/4 GND, 5/6 3V3, 7 SCL, 8 SDA -->
  <rect x="150" y="455" width="175" height="75" rx="8" class="pin-power"/>
  <text x="173" y="486" class="mono small">PIN 1</text><text x="173" y="516" class="mono body">5V</text>
  <rect x="360" y="455" width="175" height="75" rx="8" class="pin-power"/>
  <text x="383" y="486" class="mono small">PIN 2</text><text x="383" y="516" class="mono body">5V</text>

  <rect x="150" y="550" width="175" height="75" rx="8" class="pin-use"/>
  <text x="173" y="581" class="mono small">PIN 3</text><text x="173" y="611" class="mono body">GND</text>
  <rect x="360" y="550" width="175" height="75" rx="8" class="pin"/>
  <text x="383" y="581" class="mono small">PIN 4</text><text x="383" y="611" class="mono body">GND</text>

  <rect x="150" y="645" width="175" height="75" rx="8" class="pin-power"/>
  <text x="173" y="676" class="mono small">PIN 5</text><text x="173" y="706" class="mono body">3V3</text>
  <rect x="360" y="645" width="175" height="75" rx="8" class="pin-power"/>
  <text x="383" y="676" class="mono small">PIN 6</text><text x="383" y="706" class="mono body">3V3</text>

  <rect x="150" y="740" width="175" height="75" rx="8" class="pin-use"/>
  <text x="173" y="771" class="mono small">PIN 7</text><text x="173" y="801" class="mono body">SCL</text>
  <rect x="360" y="740" width="175" height="75" rx="8" class="pin-use"/>
  <text x="383" y="771" class="mono small">PIN 8</text><text x="383" y="801" class="mono body">SDA</text>

  <line x1="160" y1="465" x2="315" y2="520" class="strike"/><line x1="370" y1="465" x2="525" y2="520" class="strike"/>
  <line x1="160" y1="655" x2="315" y2="710" class="strike"/><line x1="370" y1="655" x2="525" y2="710" class="strike"/>
  <text x="110" y="842" class="small ink">Use pin 3 or 4 for GND. Diagram uses pin 3.</text>

  <rect x="975" y="215" width="555" height="645" rx="18" class="panel"/>
  <text x="1017" y="275" class="label ink">JETSON ORIN NANO</text>
  <text x="1017" y="315" class="mono body">J12 40-pin expansion header</text>
  <text x="1017" y="350" class="sub">Pin numbering faces the header, not a cable end</text>
  <line x1="1015" y1="382" x2="1487" y2="382" class="rule"/>
  <text x="1088" y="425" class="mono small">ODD PINS</text>
  <text x="1304" y="425" class="mono small">EVEN PINS</text>

  <!-- Jetson J12 relevant rows -->
  <rect x="1055" y="455" width="175" height="75" rx="8" class="pin"/>
  <text x="1078" y="486" class="mono small">PIN 1</text><text x="1078" y="516" class="mono body">3V3</text>
  <rect x="1265" y="455" width="175" height="75" rx="8" class="pin-power"/>
  <text x="1288" y="486" class="mono small">PIN 2</text><text x="1288" y="516" class="mono body">5V</text>

  <rect x="1055" y="550" width="175" height="75" rx="8" class="pin-jetson"/>
  <text x="1078" y="581" class="mono small">PIN 3</text><text x="1078" y="611" class="mono body">SDA</text>
  <rect x="1265" y="550" width="175" height="75" rx="8" class="pin-power"/>
  <text x="1288" y="581" class="mono small">PIN 4</text><text x="1288" y="611" class="mono body">5V</text>

  <rect x="1055" y="645" width="175" height="75" rx="8" class="pin-jetson"/>
  <text x="1078" y="676" class="mono small">PIN 5</text><text x="1078" y="706" class="mono body">SCL</text>
  <rect x="1265" y="645" width="175" height="75" rx="8" class="pin-jetson"/>
  <text x="1288" y="676" class="mono small">PIN 6</text><text x="1288" y="706" class="mono body">GND</text>

  <text x="1015" y="770" class="small ink">All J12 data signals are 3.3V logic.</text>
  <text x="1015" y="810" class="small ink">Do not connect UPS 5V or 3V3 to J12.</text>

  <!-- Wiring paths -->
  <path d="M 325 588 C 610 588, 760 683, 1265 683" class="wire-gnd"/>
  <circle cx="325" cy="588" r="12" class="dot-gnd"/><circle cx="1265" cy="683" r="12" class="dot-gnd"/>
  <path d="M 325 778 C 620 778, 755 683, 1055 683" class="wire-scl"/>
  <circle cx="325" cy="778" r="12" class="dot-scl"/><circle cx="1055" cy="683" r="12" class="dot-scl"/>
  <path d="M 535 778 C 715 778, 835 588, 1055 588" class="wire-sda"/>
  <circle cx="535" cy="778" r="12" class="dot-sda"/><circle cx="1055" cy="588" r="12" class="dot-sda"/>

  <rect x="650" y="454" width="275" height="170" rx="12" fill="#e5eceb" stroke="#18232b" stroke-width="3"/>
  <text x="680" y="495" class="mono label">CONNECT</text>
  <circle cx="686" cy="535" r="9" class="dot-gnd"/><text x="708" y="543" class="mono small">GND: UPS 3 → J12 6</text>
  <circle cx="686" cy="575" r="9" class="dot-scl"/><text x="708" y="583" class="mono small">SCL: UPS 7 → J12 5</text>
  <circle cx="686" cy="615" r="9" class="dot-sda"/><text x="708" y="623" class="mono small">SDA: UPS 8 → J12 3</text>

  <rect x="70" y="900" width="1460" height="135" rx="16" class="warning"/>
  <text x="105" y="946" class="label" fill="#8c2f2a">STOP: THIS IS DATA ONLY, NOT ANOTHER POWER CONNECTION.</text>
  <text x="105" y="986" class="body ink">Set the UPS I2C level selector to 3.3V. Leave UPS pins 1, 2, 5, and 6 open. The existing barrel pigtail remains the Jetson's only UPS power lead.</text>
  <text x="70" y="1073" class="small mono">Sources: Waveshare UPS Module 3S schematic + product page; NVIDIA Jetson Orin Nano carrier-board spec. Retrieved 2026-07-31.</text>
</svg>
