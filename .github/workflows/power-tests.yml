name: Beast Power Tests

# Pure-logic + fake-bus suite for beast_power (PR-2a). No rclpy, no I²C
# hardware, no colcon — same cheap gate pattern as the command spine tests.

on:
  pull_request:
  push:
    branches:
      - ros2-humble-develop
      - main
      - 'beast/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  power:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.10'

      - name: Install test dependencies
        run: pip install pytest

      - name: Run beast_power fake-bus tests
        run: python -m pytest src/ugv_main/beast_power/test -q
