name: Beast power tests

on:
  pull_request:
    paths:
      - 'robot/beast/ros2_ws/src/ugv_main/beast_power/**'
      - '.github/workflows/beast-power-tests.yml'
  push:
    branches: [main]
    paths:
      - 'robot/beast/ros2_ws/src/ugv_main/beast_power/**'
      - '.github/workflows/beast-power-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  power:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: robot/beast/ros2_ws
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.10'

      - run: pip install pytest
      - run: python -m pytest src/ugv_main/beast_power/test -q
