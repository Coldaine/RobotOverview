name: Storage foundation

on:
  pull_request:
    paths: ["deploy/storage/**", "deploy/systemd/**", ".github/workflows/storage.yml"]
  workflow_dispatch:

jobs:
  storage-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s deploy/storage/tests -v
      - run: systemd-analyze verify deploy/systemd/beast-*.service deploy/systemd/beast-*.timer
