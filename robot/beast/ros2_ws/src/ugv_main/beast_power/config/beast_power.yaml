# BEAST-01 UPS Module 3S → Orin I²C defaults (Wave 1 scaffold).
# Wave 2 hardware session must confirm bus (/dev/i2c-X) and INA219 address
# via i2cdetect after wiring UPS header pins 3/7/8 → Jetson J12 6/5/3.
beast_power:
  ros__parameters:
    i2c_bus_nr: 7
    sensor_address: 0x40
    data_publish_rate: 1.0
    # Flip to -1.0 if shunt orientation reports discharge as positive.
    current_sign: 1.0
    charging_current_threshold_a: 0.05
    voltage_topic: /ugv/voltage
    charging_topic: /ugv/charging_active
    frame_id: base_link
